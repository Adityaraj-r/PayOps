# PayOps | Author: differentiatorX <madhur.m2006@gmail.com>
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Start MongoDB replica set and Redis for lifecycle tests
        run: |
          docker run -d --name payops-test-mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          docker run -d --name payops-test-redis -p 6379:6379 redis:7-alpine
          for attempt in $(seq 1 30); do
            if docker exec payops-test-mongo mongosh --quiet --eval "db.adminCommand({ping:1}).ok" | grep -q 1; then break; fi
            sleep 1
          done
          docker exec payops-test-mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for attempt in $(seq 1 30); do
            if docker exec payops-test-mongo mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true; then break; fi
            sleep 1
          done
          for attempt in $(seq 1 30); do
            if docker exec payops-test-redis redis-cli ping | grep -q PONG; then break; fi
            sleep 1
          done
      - run: npm test -- --runInBand
        env:
          PAYOPS_INTEGRATION: "1"
          NODE_ENV: test
          PAYMENT_PROVIDER: mockbank
          MONGO_URI: mongodb://127.0.0.1:27017/payops_test?replicaSet=rs0
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: ci-only-test-secret-that-is-not-used-outside-this-job
          MOCKBANK_WEBHOOK_SECRET: ci-mockbank-webhook-secret-32-characters-long
      - name: App boots and wires every route
        run: node -e "require('./src/app').createApp(); console.log('ok')"

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
